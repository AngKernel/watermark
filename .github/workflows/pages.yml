name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify on Node 24
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - name: Upload the tested static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1
      - name: Check whether Pages is enabled
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages')"
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != 'true' ]; then
            echo '::notice::Build passed, but the site is NOT published: enable GitHub Pages with source GitHub Actions, then run this workflow again.'
            {
              echo '## 构建已通过，站点尚未发布'
              echo
              echo "请打开 https://github.com/${GITHUB_REPOSITORY}/settings/pages ，将 Build and deployment → Source 设为 GitHub Actions。"
              echo
              echo '然后在 Actions → Deploy to GitHub Pages → Run workflow 中选择 master 并运行。'
              echo '本次 deploy job 被跳过，不代表站点已经上线。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
